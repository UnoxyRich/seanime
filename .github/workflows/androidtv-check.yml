name: Android TV checks

on:
  pull_request:
    paths:
      - "androidtv/**"
      - "mobile/**"
      - "internal/**"
      - "seanime-web/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-android-ffmpeg.sh"
      - "scripts/verify_android_native_alignment.py"
      - "scripts/test_android_native_alignment.py"
      - "scripts/run_android_tv_instrumentation.py"
      - "scripts/test_android_tv_evidence.py"
      - ".github/workflows/androidtv-check.yml"
  push:
    paths:
      - "androidtv/**"
      - "mobile/**"
      - "internal/**"
      - "seanime-web/**"
      - "go.mod"
      - "go.sum"
      - "scripts/build-android-ffmpeg.sh"
      - "scripts/verify_android_native_alignment.py"
      - "scripts/test_android_native_alignment.py"
      - "scripts/run_android_tv_instrumentation.py"
      - "scripts/test_android_tv_evidence.py"
      - ".github/workflows/androidtv-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-tv:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: seanime-web/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Install native media build tools
        run: sudo apt-get update && sudo apt-get install --yes nasm pkg-config

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install frontend dependencies
        working-directory: seanime-web
        run: npm ci

      - name: Test native alignment verifier
        run: python3 -m unittest discover -s scripts -p test_android_native_alignment.py

      - name: Test Android TV evidence collector
        run: python3 -m unittest discover -s scripts -p test_android_tv_evidence.py

      - name: Test shared frontend
        working-directory: seanime-web
        run: npm test

      - name: Test Android playback checkpoints
        run: go test -ldflags=-checklinkname=0 ./internal/directstream ./mobile -run '^(TestCaptureResumeSource|TestPlaybackCheckpoint)' -count=1

      - name: Test transcoding capability detection
        run: go test -ldflags=-checklinkname=0 ./internal/mediastream/cassette -count=1

      - name: Test Android storage and direct streaming
        run: go test -ldflags=-checklinkname=0 ./internal/androidtvstorage ./internal/directstream -count=1

      - name: Build Android TV APKs
        id: build_apks
        working-directory: androidtv
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon

      - name: Verify APK native alignment
        run: python3 scripts/verify_android_native_alignment.py androidtv/app/build/outputs/apk/debug/*.apk

      - name: Record installable APK identity
        working-directory: androidtv/app/build/outputs/apk
        run: |
          mkdir -p ../tv-transfer
          cp debug/app-arm64-v8a-debug.apk debug/app-x86_64-debug.apk androidTest/debug/app-debug-androidTest.apk ../tv-transfer/
          cd ../tv-transfer
          sha256sum app-arm64-v8a-debug.apk app-x86_64-debug.apk app-debug-androidTest.apk > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT.txt

      - name: Retain installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-debug-apks-${{ github.sha }}
          path: |
            androidtv/app/build/outputs/tv-transfer/app-arm64-v8a-debug.apk
            androidtv/app/build/outputs/tv-transfer/app-x86_64-debug.apk
            androidtv/app/build/outputs/tv-transfer/app-debug-androidTest.apk
            androidtv/app/build/outputs/tv-transfer/SHA256SUMS
            androidtv/app/build/outputs/tv-transfer/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Initialize emulator ADB transport
        run: adb start-server

      - name: Run Android TV instrumentation tests
        id: connected_suite
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: seanime-connected-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-port: 5554
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: androidtv
          # One command: the action runs separate script lines in separate shells.
          script: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 ../scripts/run_android_tv_instrumentation.py

      - name: Retain failed ordinary TV evidence early
        if: ${{ !cancelled() && steps.connected_suite.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-ordinary-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            androidtv/build/native-ci-evidence/connected-suite/evidence.zip
            androidtv/build/native-ci-evidence/connected-suite/collection-status.json
          if-no-files-found: warn
          retention-days: 1

      - name: Run owned library playback journey on a fresh AVD
        id: owned_library_journey
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: seanime-owned-journey-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-port: 5556
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: androidtv
          script: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 ../scripts/run_android_tv_instrumentation.py --invocation owned-library-journey --class 'app.seanime.tv.AndroidIsolatedLibraryPlaybackJourneyTest#remoteOnlyLibraryFilesAndExplorerPlayOwnedMultitrackVideo' --runner-flag isolatedNativeGoLibraryPlaybackJourneyFixture --runner-flag freshInstrumentationProcess

      - name: Verify owned journey ran once without skips
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        run: python3 scripts/run_android_tv_instrumentation.py --check-acceptance --invocation owned-library-journey --class 'app.seanime.tv.AndroidIsolatedLibraryPlaybackJourneyTest#remoteOnlyLibraryFilesAndExplorerPlayOwnedMultitrackVideo'

      - name: Run owned library management on a fresh AVD
        id: owned_library_management
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: seanime-owned-management-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-port: 5558
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: androidtv
          script: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 ../scripts/run_android_tv_instrumentation.py --invocation owned-library-management --class 'app.seanime.tv.AndroidIsolatedLibraryManagementTest#importedOwnedUnmatchedIndexSupportsNativeBulkRenameExplorerAndDelete' --runner-flag isolatedNativeGoLibraryManagementFixture --runner-flag freshInstrumentationProcess

      - name: Verify owned library management ran once without skips
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        run: python3 scripts/run_android_tv_instrumentation.py --check-acceptance --invocation owned-library-management --class 'app.seanime.tv.AndroidIsolatedLibraryManagementTest#importedOwnedUnmatchedIndexSupportsNativeBulkRenameExplorerAndDelete'

      - name: Run owned raw media playback on a fresh AVD
        id: owned_raw_media
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: seanime-owned-raw-media-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-port: 5560
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: androidtv
          script: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 ../scripts/run_android_tv_instrumentation.py --invocation owned-raw-media --class 'app.seanime.tv.AndroidIsolatedRawMediaPlaybackTest#generatedVideoUsesSignedGoRangeRouteAndNativePlayerWithoutMetadata' --runner-flag isolatedNativeGoRawMediaFixture --runner-flag freshInstrumentationProcess

      - name: Verify owned raw media playback ran once without skips
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        run: python3 scripts/run_android_tv_instrumentation.py --check-acceptance --invocation owned-raw-media --class 'app.seanime.tv.AndroidIsolatedRawMediaPlaybackTest#generatedVideoUsesSignedGoRangeRouteAndNativePlayerWithoutMetadata'

      - name: Run owned external player handoff on a fresh AVD
        id: owned_external_player
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          avd-name: seanime-owned-external-player-${{ github.run_id }}-${{ github.run_attempt }}
          force-avd-creation: true
          emulator-port: 5562
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          working-directory: androidtv
          script: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" python3 ../scripts/run_android_tv_instrumentation.py --invocation owned-external-player --class 'app.seanime.tv.AndroidIsolatedRawMediaPlaybackTest#nativeMoreHandsOwnedGoVideoToSeparatePlayerAcrossBackgroundAndReturnsPaused' --runner-flag isolatedNativeGoExternalPlayerFixture --runner-flag freshInstrumentationProcess

      - name: Verify owned external player handoff ran once without skips
        if: ${{ !cancelled() && steps.build_apks.outcome == 'success' }}
        run: python3 scripts/run_android_tv_instrumentation.py --check-acceptance --invocation owned-external-player --class 'app.seanime.tv.AndroidIsolatedRawMediaPlaybackTest#nativeMoreHandsOwnedGoVideoToSeparatePlayerAcrossBackgroundAndReturnsPaused'

      - name: Retain Android TV test evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            androidtv/build/native-ci-evidence/connected-suite/evidence.zip
            androidtv/build/native-ci-evidence/connected-suite/collection-status.json
            androidtv/build/native-ci-evidence/owned-library-journey/evidence.zip
            androidtv/build/native-ci-evidence/owned-library-journey/collection-status.json
            androidtv/build/native-ci-evidence/owned-library-management/evidence.zip
            androidtv/build/native-ci-evidence/owned-library-management/collection-status.json
            androidtv/build/native-ci-evidence/owned-raw-media/evidence.zip
            androidtv/build/native-ci-evidence/owned-raw-media/collection-status.json
            androidtv/build/native-ci-evidence/owned-external-player/evidence.zip
            androidtv/build/native-ci-evidence/owned-external-player/collection-status.json
          if-no-files-found: warn
          retention-days: 14
